<body>
<header>
 <h1>Day 6 · Data Ingestion: so sánh chiến lược chunking và model embedding</h1>
 <div class="sub">Corpus: EU AI Act (bản Nghị viện thông qua 13/03/2024) + GDPR · 572 trang nội dung · PostgreSQL + pgvector · 24 câu benchmark (18 dev / 6 test)</div>
 <nav><button data-t="res" class="on">Kết quả</button><button data-t="cmp">So sánh câu hỏi</button><button data-t="live">Tìm thử</button></nav>
</header>
<div class="modal" id="modal"><div class="box" id="mbox"></div></div>
<main>
 <section id="res"></section>
 <section id="cmp" hidden></section>
 <section id="live" hidden></section>
</main>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let D=null,Q=[],TR={};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));['res','cmp','live'].forEach(id=>$('#'+id).hidden=id!==b.dataset.t);if(b.dataset.t==='cmp'&&CQ)showCmp(CQ.id)});
const EXPLAIN={
 F:{what:'Cắt cố định (fixed-size), không chồng lấn.',how:'Mỗi trang PDF được cắt thành các đoạn liền nhau đúng 500 ký tự, không quan tâm câu, khoản hay Điều. Đoạn sau bắt đầu ngay chỗ đoạn trước kết thúc.',why:'Ranh giới rơi bất kỳ đâu, nên câu và cả chữ bị cắt đôi (coherence chấm tay 0,1/2). Câu trích bằng chứng nằm vắt qua ranh giới sẽ không có chunk nào chứa trọn, nên bị tính trượt (lỗi evidence_split). Metadata Điều lấy theo đầu trang nên sai với đoạn ở nửa dưới trang. Đây là baseline thấp nhất ở cả 3 model.'},
 A:{what:'Cắt cố định + overlap 10%.',how:'Giống F (500 ký tự mỗi đoạn), nhưng mỗi đoạn lặp lại 50 ký tự cuối của đoạn trước, để câu nằm ở ranh giới vẫn có cơ hội xuất hiện trọn trong đoạn kế.',why:'Overlap cứu được một phần các câu bị cắt ở ranh giới, nên Hit@3 tăng so với F (bge dev 6→8) và số lỗi evidence_split giảm. Nhưng 50 ký tự là quá ngắn so với một khoản luật dài, và đoạn vẫn bắt đầu giữa chữ (coherence 0,1/2). Số chunk nhiều nhất (2283), đắt nhất khi lưu.'},
 D:{what:'Cắt đệ quy (recursive).',how:'Thử cắt ở ranh giới lớn nhất trước (đoạn trống → xuống dòng → dấu chấm câu → khoảng trắng) cho tới khi mỗi mẩu ≤ 800 ký tự, rồi nối thêm 80 ký tự cuối của mẩu trước. Vẫn làm theo từng trang.',why:'Ranh giới thường trùng câu hoặc dòng nên chunk dài hơn, giữ trọn câu hơn A, Hit@3 cao hơn (Gemma dev 13/18). Nhưng phần overlap 80 ký tự được cắt máy móc nên chunk thường bắt đầu giữa chữ (coherence 0,8/2). Không biết cấu trúc Điều/khoản, nên vẫn gộp đuôi Điều này với đầu Điều khác.'},
 B:{what:'Cắt theo cấu trúc văn bản (document structure).',how:'Đọc cả văn bản như một dòng chảy qua các trang, mở đơn vị mới ở mỗi recital "(12)", "Article N", khoản "1.", điểm phụ lục. Gộp các đơn vị nhỏ cùng một Điều tới ≤ 1200 ký tự, và gắn header như "[GDPR | Chapter III | Article 12 Transparent information…]" vào đầu chunk.',why:'Mỗi chunk là một ý pháp lý trọn vẹn, có tên Điều trong header, nên embedding "biết" chunk nói về gì. Kết quả: Hit@3 cao nhất khi không lọc (bge 13/18, Gemma 18/18), coherence 1,6/2, metadata đúng 18/18 vì cấu trúc được theo dõi từng dòng. Điểm yếu: recital và Điều nói cùng chủ đề nên đôi khi trả về recital thay vì Điều (q21 deep fake).'},
 S:{what:'Cắt theo ngữ nghĩa (semantic).',how:'Tách câu, embed từng câu bằng bge-small, đo độ tương đồng giữa hai câu liền kề. Cắt ở những chỗ có độ tương đồng thấp nhất (10% thấp nhất trong cả văn bản), giới hạn 200–1200 ký tự.',why:'Ranh giới theo chủ đề nên chunk khá liền mạch (coherence 1,6/2, ngang B). Nhưng nó không biết tiêu đề Điều và không có header, nên có thể gộp hai Điều hoặc tách câu dẫn khỏi danh sách điểm. Với bge, Hit@3 chỉ ngang A (8/18); với Gemma tốt hơn nhiều (14/18), vì Gemma phân biệt nghĩa tốt hơn trên chunk không có header.'},
 L:{what:'Cắt bằng LLM (agentic chunking).',how:'Claude Haiku 5.5 đọc từng trang với số dòng "[12] …" và trả về danh sách dòng bắt đầu ý mới (JSON, có schema), theo luật trong system prompt (giữ câu dẫn với danh sách điểm, giữ tiêu đề Điều với khoản 1). Chỉ chạy trên 30 trang mẫu (25 trang gold + 5 ngẫu nhiên) để tiết kiệm, khoảng $0,004 nhờ prompt caching. Các trang còn lại cắt bằng D.',why:'Trên trang có đáp án, chunk rất sạch nên Hit@1 cao (MiniLM dev 11/18, cao nhất), và thường đứng hạng 1–2 ở bảng xếp hạng. Nhưng kết quả này lạc quan: chỉ đúng các trang gold được LLM cắt, còn trang gây nhiễu giống D. Chưa biết nếu chạy cả corpus thì L còn giữ lợi thế không.'},
 C:{what:'Cắt theo cấu trúc + lọc metadata.',how:'Dùng đúng index của B. Khi câu hỏi tự nêu phạm vi ("theo các recital", "trong phụ lục"), trang thêm điều kiện part = recital / annex vào câu SQL trước khi xếp hạng vector. Câu không nêu phạm vi thì chạy giống hệt B.',why:'Lọc loại bỏ các đoạn đúng chủ đề nhưng sai phạm vi. Ví dụ q19: không lọc thì ra recital (56); có lọc annex thì lấy đúng Phụ lục III. Với bge, dev Hit@3 13→14/18 và test 3→4/6; lọc được tuân thủ 4/4 câu. Với Gemma, B đã tốt nên lọc không thêm gì. Lọc chỉ giúp khi người dùng cho biết phạm vi trước.'}
};
const qm=k=>`<button class="qm" data-k="${k}" title="Kỹ thuật ${k} là gì?">?</button>`;
function nums(k){if(!D)return '';return D.models.filter(m=>D.retrieval[m.key]).map(m=>{const x=D.retrieval[m.key][k]||{};const d=x.dev,t=x.test;return `<tr><td>${esc(m.name)}</td><td class="num">${d?d.hit1+'/'+d.n:'-'}</td><td class="num">${d?d.hit3+'/'+d.n:'-'}</td><td class="num">${t?t.hit3+'/'+t.n:'-'}</td></tr>`}).join('')}
document.addEventListener('click',e=>{const b=e.target.closest('.qm');if(b){openQ(b.dataset.k,b.dataset.m)}else if(e.target.id==='modal'){$('#modal').classList.remove('show')}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#modal').classList.remove('show')});
function heat(n,N){if(!N)return '';const p=n/N;return `background:rgba(31,107,74,${(0.08+p*0.55).toFixed(2)});${p>0.6?'color:#fff;':''}`}
function cell(v,k){if(!v)return '<td class="num">-</td>';return `<td class="num" style="${heat(v[k],v.n)}">${v[k]}/${v.n}</td>`}
async function load(){
 try{D=await (await fetch('../starter/results/report_data.json',{cache:'no-store'})).json()}catch(e){$('#res').innerHTML='<div class="panel err">Chưa có results/report_data.json: chạy <code>python -m src.report</code>.</div>';return}
 Q=(await (await fetch('../benchmark/questions.jsonl')).text()).trim().split('\n').map(l=>JSON.parse(l));
 renderRes();renderCmp();renderLive();
}
function renderRes(){
 const S=D.strategies;let h='';

 for(const m of D.models){const r=D.retrieval[m.key];if(!r)continue;
  h+=`<div class="panel"><h2>${esc(m.name)} <span class="small">${m.dims} chiều</span></h2><table><tr><th>Chiến lược</th><th>Dev Hit@1</th><th>Dev Evidence Hit@3</th><th>Test Hit@1</th><th>Test Evidence Hit@3</th><th>Chunk</th></tr>`;
  for(const s of S){const x=r[s.key]||{};const ing=(D.ingest[m.key]?.strategies||{})[s.key==='C'?'B':s.key]||{};
   h+=`<tr><td><b>${s.key}</b> · ${esc(s.name)}${qm(s.key)}</td>${cell(x.dev,'hit1')}${cell(x.dev,'hit3')}${cell(x.test,'hit1')}${cell(x.test,'hit3')}<td class="num">${ing.chunks??'-'}</td></tr>`}
  h+='</table></div>'}
 const M=D.manual_bge;
 h+=`<div class="panel"><h2>Chấm tay (model bge-small)</h2><table><tr><th>Chiến lược</th><th>Coherence TB /2 (10 vị trí)</th><th>Metadata đủ & đúng (test top-3)</th><th>Grounding 0/1/2 (6 câu test)</th><th>Grounding TB /2</th></tr>`;
 for(const s of S){const x=M[s.key];h+=`<tr><td><b>${s.key}</b> · ${esc(s.name)}${qm(s.key)}</td><td class="num" style="${heat(x.coherence_mean??0,2)}">${x.coherence_mean??'-'}</td><td class="num" style="${heat(x.metadata_ok,x.metadata_n)}">${x.metadata_ok}/${x.metadata_n}</td><td class="num">${(x.grounding_counts||[]).join(' / ')}</td><td class="num" style="${heat(x.grounding_mean??0,2)}">${x.grounding_mean??'-'}</td></tr>`}
 h+=`</table><div class="legend">Nhãn chấm tay do Claude (trợ lý AI) gán theo thang của đề và học viên rà lại; có nguy cơ thiên lệch phía tác giả. File: starter/results/manual/*.csv.</div></div>`;
 const L=D.llm_chunking||{};
 h+=`<div class="panel"><h2>Chi phí LLM chunking (L)</h2><div class="small">Model ${esc(L.model)} · ${L.pages} trang mẫu · token vào ${L.tokens?.input}, đọc từ cache ${L.tokens?.cache_read}, ra ${L.tokens?.output} · ước tính $${L.cost_usd_estimate}. Các trang ngoài mẫu dùng chunk đệ quy D.</div></div>`;
 $('#res').innerHTML=h;
}
async function traces(model,s){const k=model+'/'+s;if(!TR[k]){const t=await (await fetch(`../starter/results/traces/${model}/traces_${s}.jsonl`)).text();TR[k]=Object.fromEntries(t.trim().split('\n').map(l=>{const o=JSON.parse(l);return [o.id,o]}))}return TR[k]}
function mark(text,ev){const t=esc(text);const e=esc(ev);const i=t.toLowerCase().indexOf(e.toLowerCase().slice(0,40));return i<0?t:t.slice(0,i)+'<mark>'+t.slice(i,i+e.length)+'</mark>'+t.slice(i+e.length)}
// ---------- So sánh câu hỏi: deck (3 models side by side, zoom/pan) ----------
const COL={F:'#7a7f87',A:'#c98a1b',D:'#2f7ed8',B:'#1f8a5b',S:'#8e5bd0',L:'#d1495b',C:'#138a8a'};
const MK=['bge','minilm','gemma'];
const ES={};let CQ=null,SEL=null,VIEW={x:0,y:0,s:1};
const P={rank:0,cos:1,ang:2,st:3,doc:4,pg:5,where:6,txt:7,len:8,llm:9,hdr:10};
const mname=k=>{const m=D.models.find(x=>x.key===k);return m?m.name.split('/').pop():k};
const sname=k=>D.strategies.find(x=>x.key===k).name;
const tag=k=>`<span class="stag" style="background:${COL[k]}">${k}</span>`;
const locp=p=>`${p[P.doc]} tr.${p[P.pg]}${p[P.where]?' · '+p[P.where]:''}`;
const f3=x=>(+x).toFixed(3);
const l2=c=>Math.sqrt(Math.max(0,2-2*c));
async function esq(q){if(!ES[q])ES[q]=await (await fetch(`../starter/results/embspace/${q}.json`)).json();return ES[q]}
function info(E){ // E = data for one model+strategy
 const pts=[...E.pts].sort((a,b)=>a[P.rank]-b[P.rank]);
 const ev=pts.find(p=>p[P.st]===2)||null,part=pts.find(p=>p[P.st]===1)||null;
 return {pts,ev,part,top:pts.slice(0,3),n:E.n,filter:E.filter,h1:!!ev&&ev[P.rank]===1,h3:!!ev&&ev[P.rank]<=3}}
function ranking(Em){ // order strategies for one model; ties (same chunk rank+cos) share a place
 const rows=D.strategies.map(s=>({k:s.key,...info(Em[s.key])}));
 rows.sort((a,b)=>(a.ev?a.ev[P.rank]:1e9)-(b.ev?b.ev[P.rank]:1e9)||(b.ev?b.ev[P.cos]:0)-(a.ev?a.ev[P.cos]:0));
 let pl=0,prev=null;for(const r of rows){const key=r.ev?r.ev[P.rank]+'|'+f3(r.ev[P.cos]):'none';if(key!==prev||!r.ev)pl++;prev=key;r.place=pl}
 return rows}
function renderCmp(){
 $('#cmp').innerHTML=`<div class="dbar"><button class="mbtn" id="zx" title="Quay lại các tab">← Thoát</button>
 <select id="cq">${Q.map(q=>`<option value="${q.id}">${q.id} [${q.split}] ${esc(q.question)}</option>`).join('')}</select>
 <span class="zb"><button id="zo" title="Thu nhỏ">−</button><button id="zf">Vừa màn hình</button><button id="zi" title="Phóng to">+</button></span></div>
 <div id="vp" class="vp"><div id="stage"></div></div>`;
 $('#cq').onchange=()=>showCmp($('#cq').value);
 $('#zx').onclick=()=>document.querySelector('nav button[data-t=res]').click();
 $('#zi').onclick=()=>zoomAt(1.2);$('#zo').onclick=()=>zoomAt(1/1.2);$('#zf').onclick=fit;
 const vp=$('#vp');let drag=null;
 vp.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;drag={x:e.clientX,y:e.clientY,vx:VIEW.x,vy:VIEW.y};vp.setPointerCapture(e.pointerId);vp.classList.add('grab')});
 vp.addEventListener('pointermove',e=>{if(!drag)return;VIEW.x=drag.vx+e.clientX-drag.x;VIEW.y=drag.vy+e.clientY-drag.y;apply()});
 vp.addEventListener('pointerup',()=>{drag=null;vp.classList.remove('grab')});
 vp.addEventListener('wheel',e=>{e.preventDefault();const r=vp.getBoundingClientRect();zoomAt(Math.exp(-e.deltaY*0.0015),e.clientX-r.left,e.clientY-r.top)},{passive:false});
 CQ=Q[0];
}
function apply(){$('#stage').style.transform=`translate(${VIEW.x}px,${VIEW.y}px) scale(${VIEW.s})`}
function zoomAt(f,cx,cy){const vp=$('#vp');cx??=vp.clientWidth/2;cy??=vp.clientHeight/2;const s=Math.min(3,Math.max(0.2,VIEW.s*f));VIEW.x=cx-(cx-VIEW.x)*s/VIEW.s;VIEW.y=cy-(cy-VIEW.y)*s/VIEW.s;VIEW.s=s;apply()}
function fit(){const vp=$('#vp'),st=$('#stage');VIEW.s=Math.min(1,(vp.clientWidth-24)/st.offsetWidth);VIEW.x=(vp.clientWidth-st.offsetWidth*VIEW.s)/2;VIEW.y=12;apply()}
async function showCmp(qid){
 CQ=Q.find(x=>x.id===qid);const E=await esq(qid);
 let h=`<div class="dq"><b>${esc(CQ.question)}</b><div class="small">Bằng chứng: <b>${CQ.gold_source_id.startsWith('gdpr')?'GDPR':'AI Act'} trang ${CQ.gold_page}</b> — “${esc(CQ.evidence_quote)}”${CQ.filter?` · lọc <b>part = ${esc(CQ.filter.part)}</b> (chỉ C dùng lọc)`:''} · Mỗi hàng là một model; cột xếp theo hạng (vị trí chunk chứa trọn bằng chứng, cùng vị trí thì cos cao hơn trước). Viền xanh = chunk chứa trọn bằng chứng, viền vàng = đúng trang nhưng bị cắt.</div></div>`;
 for(const m of MK){const R=ranking(E[m]);
  h+=`<div class="mrow"><div class="mh">${esc(mname(m))} <span class="small">${D.models.find(x=>x.key===m).dims} chiều</span></div><div class="mcols">`;
  for(const r of R){const t=(await traces(m,r.k))[qid];
   h+=`<div class="col" style="border-top:6px solid ${COL[r.k]}"><h3><span><span class="pl">${r.place}</span> ${tag(r.k)} ${esc(sname(r.k))}<button class="qm" data-k="${r.k}" data-m="${m}">?</button></span>
    <span><span class="hk ${r.h1?'ok':'no'}">@1 ${r.h1?'✓':'✗'}</span> <span class="hk ${r.h3?'ok':'no'}">@3 ${r.h3?'✓':'✗'}</span></span></h3>
    <div class="small">${r.ev?`bằng chứng ở #${r.ev[P.rank]} · cos ${f3(r.ev[P.cos])}`:'không chunk nào chứa trọn bằng chứng'}</div>`;
   for(const x of t.top3){const ok=String(x.is_hit)==='True',pt=E[m][r.k].pts.find(p=>p[P.rank]===+x.rank),part=!ok&&pt&&pt[P.st]===1;
    h+=`<div class="hit ${ok?'ok':''} ${part?'part':''}"><div class="meta"><b>#${x.rank}</b><span>${pt?esc(locp(pt)):esc(x.document_id+' p'+x.page)}</span><span>cos ${f3(x.score)}</span></div><div class="txt">${snip(x.text)}</div></div>`}
   h+='</div>'}
  h+='</div></div>'}
 $('#stage').innerHTML=h;
 if(!showCmp.done&&$('#vp').offsetWidth){showCmp.done=1;fit()}
}
function snip(text){const t=String(text),ev=CQ.evidence_quote;const i=t.toLowerCase().indexOf(ev.toLowerCase().slice(0,40));
 if(i<0)return esc(t.length>420?t.slice(0,420)+' …':t);const a=Math.max(0,i-180),b=Math.min(t.length,i+ev.length+180);
 return (a?'… ':'')+esc(t.slice(a,i))+'<mark>'+esc(t.slice(i,i+ev.length))+'</mark>'+esc(t.slice(i+ev.length,b))+(b<t.length?' …':'')}
function hl(t){const e=CQ.evidence_quote.toLowerCase().slice(0,30);const i=t.toLowerCase().indexOf(e);return i<0?esc(t)+'…':esc(t.slice(0,i))+'<mark>'+esc(t.slice(i))+'</mark>…'}
function plot(I,k,size){
 const W=size,H=size*0.8,cx=W/2,cy=H/2,R=Math.min(cx,cy)-30;
 const ds=I.pts.map(p=>1-p[P.cos]);const d0=Math.max(0,Math.min(...ds)-0.02),d1=Math.max(...ds);
 const rad=d=>22+(R-22)*Math.pow((d-d0)/((d1-d0)||1),0.6);
 const xy=p=>{const r=rad(1-p[P.cos]);return [cx+r*Math.cos(p[P.ang]),cy+r*Math.sin(p[P.ang])]};
 let s=`<svg viewBox="0 0 ${W} ${H}" class="esp">`;
 for(const d of [d0+(d1-d0)*0.1,d0+(d1-d0)*0.4,d1]){s+=`<circle cx="${cx}" cy="${cy}" r="${rad(d)}" fill="none" stroke="#e3e6ea"/><text x="${cx+3}" y="${cy-rad(d)-3}" class="rl">cos ${f3(1-d)}</text>`}
 const ev=I.ev;
 for(const p of I.pts){if(p[P.rank]<=3||p===ev)continue;const [x,y]=xy(p);
  s+=`<circle class="pt" cx="${x}" cy="${y}" r="${p[P.st]?5:3.2}" fill="${p[P.st]===1?'#e2a400':'#b7bcc3'}" ${p[P.st]?'stroke="#7a5a00"':''}><title>#${p[P.rank]} · ${locp(p)} · cos ${f3(p[P.cos])}${p[P.st]===1?' · chỉ chứa một phần bằng chứng':''}\n${p[P.txt].slice(0,160)}…</title></circle>`}
 const lines=[...I.top];if(ev&&ev[P.rank]>3)lines.push(ev);
 for(const p of lines){const [x,y]=xy(p);const isEv=p[P.st]===2,top=p[P.rank]<=3;
  s+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="${top?COL[k]:'#1f8a5b'}" stroke-width="${top?2:1.6}" ${top?'':'stroke-dasharray="5 4"'}/>`;
  s+=`<circle class="pt" cx="${x}" cy="${y}" r="${top?10:8}" fill="${top?COL[k]:'#fff'}" stroke="${isEv?'#0f6b3a':'#fff'}" stroke-width="${isEv?3.5:1.5}"><title>#${p[P.rank]} · ${locp(p)}\ncos ${f3(p[P.cos])} · d=1−cos ${f3(1-p[P.cos])} · L2 ${f3(l2(p[P.cos]))}${isEv?'\nchứa trọn câu bằng chứng':''}\n${p[P.txt].slice(0,160)}…</title></circle>`;
  if(top)s+=`<text x="${x}" y="${y+4}" class="pn">${p[P.rank]}</text>`;
  if(!top)s+=`<text x="${x+12}" y="${y+4}" class="pl1">bằng chứng #${p[P.rank]}</text>`}
 const tbl=`<table class="mini"><tr><th></th><th>Chunk</th><th>cos</th><th>d = 1 − cos</th><th>L2</th></tr>${lines.map(p=>`<tr><td><span class="stag" style="background:${p[P.rank]<=3?COL[k]:'#0f6b3a'}">${p[P.rank]<=3?'#'+p[P.rank]:'bc #'+p[P.rank]}</span></td><td>${esc(locp(p))}${p[P.st]===2?' ✓ chứa trọn bằng chứng':p[P.st]===1?' (một phần bằng chứng)':''}</td><td>${f3(p[P.cos])}</td><td>${f3(1-p[P.cos])}</td><td>${f3(l2(p[P.cos]))}</td></tr>`).join('')}</table>`;
 s+=`<path d="${star(cx,cy,11,5)}" fill="#1d2321"/><text x="${cx}" y="${cy+24}" text-anchor="middle" class="pl1">câu hỏi</text></svg>`;
 return s+tbl+`<div class="small">Tâm = câu hỏi. Khoảng cách tới tâm = khoảng cách cosine thật d = 1 − cos (vòng tròn ghi giá trị cos; trục bán kính bắt đầu từ d=${f3(d0)} để tách các điểm gần). Góc chỉ là hình chiếu PCA nên hai điểm cạnh nhau về góc chưa chắc giống nhau. Màu: chấm đặc = top-3, viền xanh đậm = chunk chứa trọn câu bằng chứng, chấm vàng = chunk chỉ chứa một phần, chấm xám = 40 chunk gần nhất khác. L2 = √(2 − 2·cos) vì vector đã chuẩn hoá.</div>`}
function star(x,y,r,n){let d='';for(let i=0;i<2*n;i++){const a=Math.PI*i/n-Math.PI/2,rr=i%2?r*0.45:r;d+=(i?'L':'M')+(x+rr*Math.cos(a)).toFixed(1)+' '+(y+rr*Math.sin(a)).toFixed(1)}return d+'Z'}
function why(qid,m,k,E,R){
 const I=info(E[m][k]),rows=R[m],me=rows.find(r=>r.k===k),ev=I.ev,t1=I.top[0],t2=I.top[1],t3=I.top[2];
 const out=[];
 const same=rows.filter(r=>r.place===me.place&&r.k!==k).map(r=>r.k);
 out.push(`<p><b>Hạng ${me.place}</b> trong 7 kỹ thuật với câu ${qid} trên ${esc(mname(m))}${same.length?` (chung hạng với ${same.join(', ')}: trả về cùng chunk)`:''}. Hit@1 ${I.h1?'✓':'✗'}, Hit@3 ${I.h3?'✓':'✗'}.</p>`);
 let r='';
 if(!ev){r=`Không chunk nào của kỹ thuật này chứa trọn câu bằng chứng: ranh giới chunk cắt đôi câu, nên dù tìm đúng trang vẫn tính là trượt.`+(I.part?` Mảnh chứa một phần bằng chứng (${esc(locp(I.part))}) đứng #${I.part[P.rank]}, cos ${f3(I.part[P.cos])}.`:'')}
 else if(ev[P.rank]===1){r=`Chunk chứa trọn câu bằng chứng (${esc(locp(ev))}, ${ev[P.len]} ký tự) là điểm gần câu hỏi nhất: cos ${f3(ev[P.cos])}, hơn chunk #2 (${esc(locp(t2))}) ${f3(ev[P.cos]-t2[P.cos])}.`}
 else{const gap=t1[P.cos]-ev[P.cos];
  r=`Chunk chứa bằng chứng (${esc(locp(ev))}) đứng #${ev[P.rank]}/${I.n} với cos ${f3(ev[P.cos])}; chunk #1 là ${esc(locp(t1))} (cos ${f3(t1[P.cos])}), gần câu hỏi hơn ${f3(gap)}.`;
  if(t1[P.st]===1)r+=` Chunk #1 nằm đúng trang nhưng chỉ chứa một phần câu bằng chứng (bị ranh giới cắt).`;
  else if(t1[P.where]==='Recital'&&ev[P.where]!=='Recital')r+=` Chunk #1 là recital nói cùng chủ đề với Điều chứa đáp án, nên vector gần câu hỏi hơn dù không chứa câu cần tìm.`;
  else if(t1[P.doc]!==ev[P.doc])r+=` Chunk #1 thuộc văn bản khác (${t1[P.doc]}): câu hỏi dùng từ ngữ gần với đoạn đó hơn.`;
  if(ev[P.rank]>3)r+=` Để vào top-3 cần vượt chunk #3 (cos ${f3(t3[P.cos])}), còn thiếu ${f3(t3[P.cos]-ev[P.cos])}.`}
 out.push(`<p><b>Vì sao:</b> ${r}</p>`);
 const notes=[];
 if(ev){if(ev[P.len]>=950)notes.push(`chunk bằng chứng dài ${ev[P.len]} ký tự: câu cần tìm chỉ là một phần nhỏ, các ý khác làm "loãng" vector`);
  else if(ev[P.len]<=380)notes.push(`chunk bằng chứng ngắn (${ev[P.len]} ký tự): ít ngữ cảnh nhưng vector tập trung vào đúng câu`);
  if(ev[P.hdr])notes.push(`chunk có header ngữ cảnh "[${ev[P.doc]} | … | ${esc(ev[P.where])} …]" nên vector mang cả tên Điều/phần`);
  if(k==='L')notes.push(ev[P.llm]?'trang này nằm trong 30 trang mẫu do Haiku cắt':'trang này ngoài mẫu LLM nên được cắt bằng D')}
 if(k==='C'){const b=info(E[m].B);notes.push(I.filter?`lọc part = ${I.filter} chỉ còn ${I.n} chunk; B (không lọc) đặt bằng chứng ở ${b.ev?'#'+b.ev[P.rank]:'không đâu'}, C ở ${ev?'#'+ev[P.rank]:'không đâu'}`:'câu này không có lọc nên C cho kết quả giống hệt B')}
 if(notes.length)out.push(`<p><b>Đặc điểm chunk:</b> ${notes.join('; ')}.</p>`);
 // vs other techniques on this model
 const best=rows[0];
 out.push(`<p><b>So với kỹ thuật khác (cùng ${esc(mname(m))}):</b></p><table class="mini"><tr><th>Hạng</th><th>Kỹ thuật</th><th>Bằng chứng ở</th><th>cos</th><th>Độ dài chunk</th></tr>${rows.map(x=>`<tr class="${x.k===k?'me':''}"><td>${x.place}</td><td>${tag(x.k)} ${esc(sname(x.k))}</td><td>${x.ev?'#'+x.ev[P.rank]:x.part?'chỉ có mảnh, #'+x.part[P.rank]:'—'}</td><td>${x.ev?f3(x.ev[P.cos]):'—'}</td><td>${x.ev?x.ev[P.len]:'—'}</td></tr>`).join('')}</table>`);
 if(best.k!==k&&best.ev){const b=best.ev;out.push(`<p>Kỹ thuật đứng đầu (${best.k}) cắt bằng chứng thành chunk ${b[P.len]} ký tự${b[P.hdr]?' có header':''}, cos ${f3(b[P.cos])}${ev?`; ${k} có cos ${f3(ev[P.cos])} (kém ${f3(b[P.cos]-ev[P.cos])})`:''}.</p>`)}
 // vs other models, same technique
 out.push(`<p><b>Cùng kỹ thuật ${k} trên model khác:</b> ${MK.map(mm=>{const x=R[mm].find(y=>y.k===k);return `${esc(mname(mm))}: hạng ${x.place}, ${x.ev?'bằng chứng #'+x.ev[P.rank]+' (cos '+f3(x.ev[P.cos])+')':'không có chunk chứa trọn'}`}).join(' · ')}.</p>`);
 return out.join('')}

// ---------- source code shown in the ? popup (read live from starter/src, so it is the code that produced the results) ----------
const SRC={};
async function src(f){if(!SRC[f])SRC[f]=(await (await fetch(`../starter/src/${f}`)).text()).split('\n');return SRC[f]}
function pyBlock(L,name){const i=L.findIndex(l=>new RegExp(`^\\s*(async\\s+)?(def|class)\\s+${name}\\b`).test(l));if(i<0)return null;
 const ind=L[i].match(/^\s*/)[0].length;let j=i+1;
 for(;j<L.length;j++){const l=L[j];if(!l.trim())continue;const k=l.match(/^\s*/)[0].length;if(k<=ind&&!/^\s*[)\]}]/.test(l))break}
 while(j>i&&!L[j-1].trim())j--;return {from:i+1,to:j,code:L.slice(i,j).join('\n')}}
function pyRange(L,start,n){const i=L.findIndex(l=>l.includes(start));return i<0?null:{from:i+1,to:i+n,code:L.slice(i,i+n).join('\n')}}
const CODE={
 F:[['chunking.py','fixed_no_overlap']],A:[['chunking.py','fixed_size']],D:[['chunking.py','_recursive_split'],['chunking.py','recursive']],
 B:[['chunking.py','structure_aware']],S:[['chunking.py','split_sentences'],['chunking.py','semantic']],
 L:[['llm_chunker.py','sample_pages'],['llm_chunker.py','_call'],['chunking.py','llm_chunks']],C:[['chunking.py','structure_aware']]};
async function codeBlocks(k,m){
 const part=async(f,name)=>{const L=await src(f);const b=pyBlock(L,name);return b?{t:`starter/src/${f}:${b.from}–${b.to} · ${name}`,c:b.code}:null};
 const chunk=(await Promise.all(CODE[k].map(([f,n])=>part(f,n)))).filter(Boolean);
 const R=await src('run.py');const call=pyRange(R,'out["'+(k==='C'?'B':k)+'"].extend(',1);
 if(call)chunk.unshift({t:`starter/src/run.py:${call.from} · cách gọi cho ${k==='C'?'B (C dùng lại index B)':k}`,c:call.code});
 const emb=[await part('embeddings.py','MyEmbedder')].filter(Boolean);
 const st=await part('store.py','search');const ev=pyRange(R,'qvecs = {q["id"]: emb.embed_query',8);
 const qry=[ev&&{t:`starter/src/run.py:${ev.from}–${ev.to} · embed câu hỏi rồi tìm (C: filters = lọc part của câu hỏi)`,c:ev.code},st].filter(Boolean);
 const cfg=D.strategies.find(x=>x.key===k).config;const mm=D.models.find(x=>x.key===m)||{};
 const mode=/bge/i.test(mm.name)?'BGE: câu hỏi thêm tiền tố "Represent this sentence for searching relevant passages: ", chunk không thêm gì':/gemma/i.test(mm.name)?'EmbeddingGemma: encode_query / encode_document (prompt "query" / "document" có sẵn của model)':'MiniLM: không dùng prompt';
 const box=(title,note,arr)=>`<details class="code"><summary>${title}</summary>${note?`<div class="small">${note}</div>`:''}${arr.map(b=>`<div class="ct2">${esc(b.t)}</div><pre><code>${esc(b.c)}</code></pre>`).join('')}</details>`;
 return box('Code chunking',`Cấu hình: <code>${esc(JSON.stringify(cfg))}</code>`,chunk)+
  box('Code embedding',`Model ${esc(mm.name||m)} · ${mm.dims||''} chiều · ${mode}. Vector chuẩn hoá L2 nên cosine = tích vô hướng.`,emb)+
  box('Code truy vấn','PostgreSQL + pgvector, tìm chính xác theo cosine (<code>&lt;=&gt;</code> là khoảng cách cosine), lọc trong SQL trước khi xếp hạng.',qry)}
async function openQ(ks,m){
 const qid=$('#cq')?.value||Q[0].id;ks=[].concat(ks);m=m||'bge';CQ=Q.find(x=>x.id===qid);const E=await esq(qid);const R={};MK.forEach(mm=>R[mm]=ranking(E[mm]));
 const order=R[m].map(r=>r.k);ks.sort((a,b)=>order.indexOf(a)-order.indexOf(b));
 const bench=k=>{const x=(D.retrieval[m]||{})[k]||{},d=x.dev,t=x.test;return d?`Toàn benchmark trên ${esc(mname(m))}: dev Hit@1 ${d.hit1}/${d.n}, dev Hit@3 ${d.hit3}/${d.n}${t?`, test Hit@3 ${t.hit3}/${t.n}`:''}.`:''};
 $('#mbox').classList.toggle('wide',ks.length>1);
 $('#mbox').innerHTML=`<button class="close" onclick="document.getElementById('modal').classList.remove('show')">Đóng</button><h3>So sánh kỹ thuật chunking trên ${esc(mname(m))}</h3>
 <div class="small" style="margin:6px 0">Câu ${qid}: ${esc(CQ.question)}</div>
 <div class="row msel" style="margin:0 0 8px"><span class="small">Chọn kỹ thuật để so sánh (xếp theo hạng trên câu này):</span>${R[m].map(r=>`<label class="mck"><input type="checkbox" value="${r.k}" ${ks.includes(r.k)?'checked':''}> ${r.place}. ${tag(r.k)} ${esc(sname(r.k))}</label>`).join('')}
 <button class="btn" id="mok">OK</button></div>
 <div class="mgrid" style="grid-template-columns:repeat(${ks.length},minmax(0,1fr))">${ks.map(k=>`<div class="mcell"><div class="mh">${tag(k)} ${esc(sname(k))}</div>
  <p class="small">${EXPLAIN[k].what} ${EXPLAIN[k].how}</p>
  <h4>Kết quả trên câu này</h4>${why(qid,m,k,E,R)}<p class="small">${bench(k)}</p><h4>Không gian embedding của câu này</h4>${plot(info(E[m][k]),k,640)}<h4>Code</h4><div id="code_${k}" class="small">Đang tải code…</div></div>`).join('')}</div>`;
 ks.forEach(async k=>{const el=document.getElementById('code_'+k);try{el.outerHTML=await codeBlocks(k,m)}catch(e){el.textContent='Không tải được code: '+e.message}});
 $('#mok').onclick=()=>{const sel=[...document.querySelectorAll('.msel input:checked')].map(i=>i.value);if(sel.length)openQ(sel,m)};
 $('#modal').classList.add('show')}
function renderLive(){
 $('#live').innerHTML=`<div class="panel"><div class="row"><input type="text" id="lq" placeholder="Hỏi về AI Act hoặc GDPR, ví dụ: How long do I have to report a data breach?">
 <select id="lm">${D.models.map(m=>`<option value="${m.key}">${esc(m.name)}</option>`).join('')}</select>
 <select id="lp"><option value="">không lọc</option><option value="recital">part = recital</option><option value="article">part = article</option><option value="annex">part = annex</option></select>
 <button class="btn" id="lgo">Tìm trên mọi chiến lược</button></div><div class="small">Cần server: <code>cd starter && python -m src.demo_server</code>. Lọc chỉ áp dụng cho C.</div><div id="lres" class="grid" style="margin-top:12px"></div></div>`;
 $('#lgo').onclick=runLive;$('#lq').onkeydown=e=>{if(e.key==='Enter')runLive()};
}
async function runLive(){
 const query=$('#lq').value.trim();if(!query)return;const model=$('#lm').value,part=$('#lp').value;
 $('#lres').innerHTML='<div class="small">Đang tìm…</div>';let h='';
 for(const s of D.strategies){
  try{const r=await fetch('/api/search',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({query,model,strategy:s.key,part})});const j=await r.json();if(j.error)throw new Error(j.error);
   h+=`<div class="col"><h3><span>${s.key} · ${esc(s.name)}</span>${j.filter?`<span class="chip">lọc ${esc(j.filter.part)}</span>`:''}</h3>`+j.hits.map((x,i)=>`<div class="hit"><div class="meta"><span>#${i+1}</span><span>${x.document_id} p${x.page}</span><span>${x.part||''}${x.article?' · Art. '+x.article:''}</span><span>score ${x.score}</span></div><div class="txt">${esc(x.text)}</div></div>`).join('')+'</div>'}
  catch(e){h+=`<div class="col err">${s.key}: ${esc(e.message)}</div>`}
  $('#lres').innerHTML=h;
 }
}
load();
</script>
</body></html>
